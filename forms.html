<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>

<body>
    <div>
        <form>
            Name: <input type="text" placeholder="UserName">
            Emailid: <input type="email" placeholder="EmailId">
            Password: <input type="Password" placeholder="password">
            <br>
            <br>
            Mobile No: <input type="tel" placeholder="Enter mobile no">
            <br>
            <br>
            <label> Country:
                <select>
                    <option value="">Select</option>
                    <option value="India"> India</option>
                    <option value="england"> England</option>
                    <option value="Singapore">Singapore</option >
                </select>
            </label>



            <label>
                <br>
                <br>
                <input type="radio" name="Candidate"> Fresher
            </label>
            <label>
                <input type="radio" name="Candidate"> Exp Professional 1+
            </label>
            <br>
            <br>
            <label>
                <input type="range" min="0" max="10">
            </label>
            <br>
            <br>
            <label>
                DOB: <input type="date" name="Date of Birth">
            </label>
            <br>
            <br>
            <label>
                <input type="checkbox" value="T&C"> T&C
            </label>
            <br>
            <div>
                <p>
                    Why do you think your the best fit for this role ?
                </p>
                <textarea name="Question" placeholder="Write in detail and logical response to get seleceted"
                    height="100" rows="5" maxlength="250"></textarea>
                <br>
                <br>
                <label>
                    <input type="file">
                </label>
                <br>
                <br>
                <button type="submit"> Apply</button>
                <br>
        </form>
    </div>



</body>

</html>
